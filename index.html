button{font:inherit;color:inherit;cursor:pointer}
.bevel{background:var(--face);box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 var(--hi),inset -2px -2px 0 #b9a8b3,inset 2px 2px 0 #fff,3px 3px 0 rgba(58,40,56,.28)}
.sunk{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 var(--hi)}

#desk{position:relative;height:calc(100% - var(--bar-h) - env(safe-area-inset-bottom,0px));overflow:hidden}
#icons{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;pointer-events:none}
.icon{pointer-events:auto;width:88px;padding:6px 4px;background:none;border:1px dashed transparent;text-align:center;border-radius:2px}
.icon .g{display:block;font-size:34px;line-height:1.1;filter:drop-shadow(2px 2px 0 rgba(58,40,56,.3))}
.icon .l{display:inline-block;margin-top:4px;padding:1px 4px;font-size:13px;color:#fff;text-shadow:1px 1px 0 var(--ink)}
.icon.sel{border-color:#fff}.icon.sel .l{background:var(--t1);text-shadow:none}
.icon:focus-visible,.task:focus-visible,.bar button:focus-visible,#start:focus-visible,.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.win{position:absolute;width:min(380px,92vw);height:300px;display:flex;flex-direction:column;padding:3px;background:var(--face);
  box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff,4px 4px 0 rgba(58,40,56,.3)}
.win[hidden]{display:none}
.win.max{inset:0!important;width:auto;height:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 4px;color:#fff;background:linear-gradient(90deg,var(--inact1),var(--inact2));touch-action:none;cursor:grab}
.win.active .bar{background:linear-gradient(90deg,var(--t1),var(--t2))}
.ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:3px}
.bar button{width:24px;height:22px;padding:0;line-height:1;color:var(--ink);background:var(--face);border:0;box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff}
.bar button:active{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
.body{flex:1;margin-top:3px;padding:12px 14px;overflow:auto;background:var(--hi);user-select:text;-webkit-user-select:text;line-height:1.5;
  box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
.body h2{margin:0 0 8px;font-size:18px}
.body p{margin:0 0 10px;max-width:60ch}
.ph{color:#8a5a7a;background:#fbe3ec;padding:1px 5px}
.things{margin:0;padding-left:34px}.things li{margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tile{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:6px;font-size:13px;background:var(--face);border:2px dashed var(--shade)}
details{margin-bottom:8px;padding:6px 8px;background:var(--face)}summary{cursor:pointer;font-weight:600}

#tray{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));padding:5px 6px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:6px;z-index:9999}
#start{height:30px;padding:0 12px;font-weight:600;border:0;display:flex;align-items:center;gap:6px;background:var(--face);box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff}
#start[aria-expanded="true"]{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0}
.task{flex:0 1 140px;min-width:44px;height:30px;padding:0 8px;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--face);box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff}
.task.active{background:#e9dff0;font-weight:600;box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
#clock{height:30px;padding:0 10px;display:grid;place-items:center;white-space:nowrap}

.menu{position:fixed;left:6px;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));width:230px;z-index:10000;display:flex}
.menu[hidden]{display:none}
.menu .side{width:30px;background:linear-gradient(0deg,var(--t1),var(--t2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 0;text-align:left;font-weight:600;font-size:18px}
.menu ul{flex:1;margin:0;padding:3px;list-style:none}
.menu li button{width:100%;padding:8px 10px;display:flex;gap:10px;align-items:center;background:none;border:0;text-align:left}
.menu li button:hover,.menu li button:focus-visible{background:var(--t1);color:#fff}
.menu hr{margin:3px 2px;border:0;border-top:1px solid var(--shade);border-bottom:1px solid #fff}

@media (max-width:640px){
  .win{position:fixed;inset:env(safe-area-inset-top,0px) 0 calc(var(--bar-h) + env(safe-area-inset-bottom,0px)) 0!important;width:auto!important;height:auto!important}
  .bar{cursor:default}.bar [data-a="max"]{display:none}
  .icon{width:80px}
}
@media (prefers-reduced-motion:no-preference){.win:not([hidden]){animation:pop .12s steps(3)}@keyframes pop{from{transform:scale(.94);opacity:.4}}}
.pl-top{display:flex;gap:8px;margin-bottom:8px}.pl-top .pl-now{flex:1;min-width:0;margin-bottom:0;display:flex;flex-direction:column;justify-content:center}
.pl-cover{width:96px;height:96px;flex:none;object-fit:cover;padding:2px;background:var(--face)}
.pl-now{padding:8px 10px;margin-bottom:8px;background:#2d1f3a;color:#ffd6e4;font-size:16px}
.pl-t{font-weight:600}.pl-a{font-size:13px;opacity:.8;min-height:1.2em}.pl-time{font-size:13px}
#plS,#plV{accent-color:var(--t1)}#plS{width:100%}
.pl-ctl{display:flex;align-items:center;gap:6px;margin:6px 0}
.pl-ctl button,.pl-file{height:30px;padding:0 12px;border:0;background:var(--face);box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff}
.pl-ctl button:active,.pl-file:active{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
.pl-ctl label{margin-left:auto;display:flex;align-items:center;gap:4px}#plV{width:80px}
.pl-list{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.pl-item{display:flex;align-items:baseline;gap:6px;padding:5px 8px;border:0;background:none;text-align:left}.pl-item small{margin-left:auto;opacity:.6}
.pl-item.on{background:var(--t1);color:#fff}
.pl-n{min-width:2.2ch;text-align:right;opacity:.7}
.pl-ctl button:focus-visible,.pl-file:focus-visible,.pl-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mini{position:absolute;top:14px;right:14px;width:min(290px,calc(100vw - 28px));padding:3px;z-index:5}
.mh{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;color:#fff;background:linear-gradient(90deg,var(--t1),var(--t2));cursor:grab;touch-action:none;font-weight:600;font-size:13px}
.mb{margin-top:3px;padding:8px;background:#2d1f3a;color:#ffd6e4}
.mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.mc{font-size:12px;opacity:.8;margin:2px 0 6px}
.mctl{display:flex;gap:4px}
.mctl button{flex:1;height:34px;border:0;color:var(--ink);background:var(--face);box-shadow:inset -1px -1px 0 var(--shade),inset 1px 1px 0 #fff}
.mctl button:active{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff}
.mctl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.mcov{width:76px;height:76px;flex:none;object-fit:cover;border:2px solid var(--face)}.mtxt{min-width:0;flex:1}.mtxt .mc{margin:2px 0 0}
.mv{display:flex;align-items:center;gap:4px;font-size:12px;margin:0 0 6px}.mv input{flex:1;min-width:0;accent-color:var(--accent)}
#miViz{display:block;width:100%;height:68px;image-rendering:pixelated;margin-bottom:4px;background:#241830}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}.eq i{width:3px;height:3px;background:#fff}
@media (prefers-reduced-motion:no-preference){.mini.on .eq i{animation:eq .6s steps(4) infinite alternate}.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.4s}.eq i:nth-child(4){animation-delay:-.1s}@keyframes eq{to{height:12px}}}
#start,#tasks,#clock{position:relative;z-index:1}
#flora{position:absolute;left:0;right:0;bottom:100%;height:80px;pointer-events:none;z-index:0}
#tl{position:absolute;inset:0;z-index:1}
/* ---- snow mode (switched on by the snowflake in the Snowflake window) ---- */
body.snow{background-color:#07080d;background-image:url(img/snow-wall.jpg);background-size:contain;background-position:center top;background-repeat:no-repeat}
.snowbank{position:absolute;left:0;right:0;bottom:-2px;height:36px;z-index:2;opacity:0;transition:opacity 2.5s ease;
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='26'%3E%3Cpath fill='%23ffffff' d='M0 26V14Q15 4 30 12T60 10T90 14T120 14V26Z'/%3E%3Cpath fill='%23e3ecf8' d='M0 26V21Q20 15 40 20T80 19T120 21V26Z'/%3E%3C/svg%3E") bottom/120px 26px repeat-x,
  url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='170' height='34'%3E%3Cpath fill='%23c9d8ee' d='M0 34V18Q20 6 45 16T95 12T145 18T170 18V34Z'/%3E%3C/svg%3E") bottom/170px 34px repeat-x}
body.back{background-color:#10130e;background-image:url(img/back-wall.jpg);background-size:contain;background-position:center top;background-repeat:no-repeat}
body.snow .grass,body.snow .gfront,body.snow #tl{display:none}
.elev{display:none;position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:4;width:176px;padding:8px 10px 10px;text-align:center;cursor:pointer;color:var(--ink);border:0;line-height:1}
body.snow .elev{display:block}
.elev .eh{display:block;margin:-2px -4px 8px;padding:3px 0;font-size:12px;letter-spacing:.12em;color:#fff;background:linear-gradient(90deg,var(--t1),var(--t2))}
.elev .en{display:block;font-size:54px;font-weight:600;letter-spacing:.02em;color:var(--t1);text-shadow:3px 3px 0 rgba(58,40,56,.22)}
.elev:hover{filter:brightness(1.05)}
.elev:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.elev .en{animation:elp 1.6s steps(2) infinite}@keyframes elp{50%{transform:scale(1.04)}}}
body.snow .snowbank{opacity:1}
.snow-btn{display:block;margin:30px auto 4px;padding:8px;background:none;border:0;cursor:pointer;line-height:0;-webkit-tap-highlight-color:transparent}
.snow-btn svg{display:block;width:84px;height:84px;overflow:visible;shape-rendering:crispEdges}
.snow-btn rect{fill:#a9b0bd}
.snow-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.snow-btn.lit rect{fill:#7ccbff}
.snow-btn.lit svg{filter:drop-shadow(0 0 5px #bfe8ff) drop-shadow(0 0 14px #7ccbff)}
@media (prefers-reduced-motion:no-preference){.snow-btn:not(.lit):hover svg{transform:scale(1.05)}.snow-btn.lit svg{animation:snt 2.4s ease-in-out infinite alternate}@keyframes snt{from{filter:drop-shadow(0 0 4px #bfe8ff) drop-shadow(0 0 10px #7ccbff)}to{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #7ccbff)}}}
.grass,.gfront{position:absolute;left:0;right:0}
.grass{bottom:-2px;height:22px;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='48' height='16'%3E%3Cg fill='%233e6a2c'%3E%3Cpath d='M0 16L3 5 6 16zM8 16L12 2 16 16zM18 16L21 6 25 16zM27 16L31 3 35 16zM37 16L40 7 44 16zM44 16L47 4 48 16z'/%3E%3C/g%3E%3Cg fill='%236a9a3e'%3E%3Cpath d='M4 16L7 8 10 16zM14 16L18 5 22 16zM23 16L26 9 30 16zM32 16L36 6 40 16zM41 16L44 10 48 16z'/%3E%3C/g%3E%3Cg fill='%238fb356'%3E%3Cpath d='M10 16L13 10 16 16zM28 16L31 11 34 16z'/%3E%3C/g%3E%3C/svg%3E") repeat-x 0 0/48px 16px,linear-gradient(#6a9a3e,#3e6a2c) 0 14px/100% 8px no-repeat}
.gfront{bottom:-2px;height:12px;z-index:2;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='12'%3E%3Cg fill='%23365a24'%3E%3Cpath d='M0 12L2 3 5 12zM11 12L14 1 17 12zM24 12L26 4 29 12zM33 12L36 2 39 12z'/%3E%3C/g%3E%3Cg fill='%2379a447'%3E%3Cpath d='M5 12L8 5 11 12zM18 12L21 3 24 12zM29 12L32 6 35 12z'/%3E%3C/g%3E%3C/svg%3E") repeat-x 0 0/40px 12px,linear-gradient(#4f7f33,#365a24) 0 8px/100% 4px no-repeat}
.tl{position:absolute;bottom:6px;transform:rotate(var(--r,0deg));transform-origin:50% 100%}
.tl svg{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.tl{animation:sway 4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(calc(var(--r) - 3deg))}to{transform:rotate(calc(var(--r) + 3deg))}}}
.lt p{margin:0 0 14px;max-width:46ch;font-size:16px;line-height:1.6}
.lt .lt-time{font-size:13px;color:#8a5a7a;letter-spacing:.04em}
.lt .lt-love{font-size:19px;font-weight:600;color:var(--t1)}
.heart-btn{display:block;margin:20px auto 8px;padding:6px;background:none;border:0;cursor:pointer;line-height:0;-webkit-tap-highlight-color:transparent}
.heart-btn svg{display:block;width:104px;height:88px;overflow:visible;shape-rendering:crispEdges}
.heart-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hp{fill:#b8aebd;stroke:#b8aebd;stroke-opacity:0;stroke-width:.12;transition:fill .25s steps(3),stroke-opacity .25s steps(3),opacity .25s steps(3)}
.hp.ghost{fill:transparent;stroke-opacity:.6;stroke-dasharray:.28 .2;opacity:.6}
.heart-btn.full .hp{fill:#ff6f91;stroke-opacity:0;opacity:1}
.heart-btn.full .hp.hl{fill:#ffa3bb}
@media (prefers-reduced-motion:reduce){.hp{transition:none!important}}
@media (prefers-reduced-motion:no-preference){.heart-btn:not(.full) svg{animation:hbp 1.6s steps(2) infinite}.heart-btn.full svg{animation:hbpop .45s steps(4)}@keyframes hbp{50%{transform:scale(1.05)}}@keyframes hbpop{40%{transform:scale(1.2)}}}
.pic{position:absolute;right:14px;bottom:92px;width:min(320px,calc((100vh - 200px)*.75));padding:3px;z-index:5;cursor:grab;touch-action:none}
.pic:active{cursor:grabbing}
.pic .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pimg{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;margin-top:3px;background:#2d1f3a;box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 var(--hi);user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
@media (max-width:640px){.pic{width:min(220px,calc((100vh - 200px)*.75));bottom:90px}}

/* ---- Pixel envelope icon + paper-letter window ---- */
.pxi{display:inline-block;width:1.15em;height:.85em;vertical-align:-.1em;shape-rendering:crispEdges}
.win.paper .body{padding:18px 16px;background:radial-gradient(ellipse at 50% 0,#8a6f58,#5d4637);font-family:"Lora",Georgia,"Times New Roman",serif}
.sheet{position:relative;margin:0 auto;max-width:480px;min-height:calc(100% - 4px);padding:34px 40px 40px;color:#2b2540;font-size:18px;line-height:1.75;
  background:radial-gradient(ellipse at 50% 40%,#fffdf6,#f6eddb 85%),#f8f0de;
  box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(120,90,50,.25),0 6px 14px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.2)}
.sheet::before{content:"";position:absolute;inset:10px;border:1px solid rgba(160,120,70,.35);pointer-events:none}
.sheet::after{content:"";position:absolute;left:0;right:0;top:33%;height:14px;transform:translateY(-50%);background:linear-gradient(transparent,rgba(120,90,40,.09) 50%,transparent);pointer-events:none}
.sheet .orn{text-align:center;color:#b88a5a;letter-spacing:.5em;font-size:18px;margin:0 0 14px;max-width:none}
.sheet p{margin:0 0 1.1em;text-align:left}.sheet p:last-child{margin-bottom:0}
.sheet .sh-top{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 22px}
.sheet .sh-date{font-size:19px;color:#6b5a7a}
.stamp{width:46px;height:56px;padding:4px;background:#fff;box-shadow:0 0 0 1px #c9b9a0,2px 2px 0 rgba(0,0,0,.15);transform:rotate(3deg);margin:-8px -10px 0 0}
.stamp div{width:100%;height:100%;display:grid;place-items:center;font-size:20px;background:linear-gradient(#f9c3d3,#e86f97);color:#fff}
.sheet .sh-sign{font-size:28px;font-weight:700;color:var(--t1);margin:26px 0 0}
.sheet .ph{font-family:"Pixelify Sans",sans-serif;font-size:13px;line-height:1.2}

/* ---- The Louvre: gilded gallery window ---- */
.win.louvre{background:linear-gradient(135deg,#f3d982,#b8892b 40%,#f7e6a8 58%,#8f651a);padding:4px;box-shadow:inset -1px -1px 0 #5a3d0a,inset 1px 1px 0 #fff3c4,4px 4px 0 rgba(58,40,56,.3)}
.win.louvre .bar{background:linear-gradient(90deg,#5d4a3a,#8c7863)}
.win.louvre.active .bar{background:linear-gradient(90deg,#4a1220,#8a2f42)}
.win.louvre .ti{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:17px;letter-spacing:.08em;color:#f6e3a8}
.win.louvre .body{overflow-x:hidden;padding:0;background:#2a0d14;box-shadow:inset 1px 1px 0 #3a2208,inset -1px -1px 0 #f3d982}
.gal{min-height:100%;display:flex;flex-direction:column;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:#f3e3b5;user-select:none;-webkit-user-select:none}
.gal figure{margin:0}
.gal-top{height:16px;flex:none;background:linear-gradient(#ecd286,#a77c25 60%,#5b3d0c);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.gal-wall{flex:1;padding:18px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:26px;background:
  radial-gradient(ellipse at 50% -10%,rgba(255,214,150,.26),transparent 60%),
  radial-gradient(circle at 25% 30%,rgba(255,255,255,.06) 0 3px,transparent 4px) 0 0/28px 28px,
  radial-gradient(circle at 75% 80%,rgba(0,0,0,.16) 0 3px,transparent 4px) 0 0/28px 28px,
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),#5b1d2a}
.gal-title{width:100%;display:flex;align-items:center;gap:12px;justify-content:center;letter-spacing:.34em;text-transform:uppercase;font-size:16px;font-weight:600;color:#f1d98c;text-shadow:0 1px 0 #000}
.gal-title::before,.gal-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#e0bf6a,transparent)}
.gal-row{width:100%;display:flex;justify-content:center;align-items:flex-start;gap:20px;padding-bottom:30px}.gal-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:40px}.gal-col+.gal-col{margin-top:56px}.gal-last{display:flex;justify-content:center;padding:0 0 34px}.gal-wall{gap:0}

.fr{position:relative;padding:9px;background:linear-gradient(135deg,#f6dd8e 0%,#b98a2e 28%,#f3d77e 52%,#8f651a 76%,#e9c767 100%);box-shadow:0 0 0 1px #4a3208,inset 0 0 0 1px rgba(255,255,255,.4),inset 0 0 0 4px rgba(120,80,10,.45),0 9px 14px rgba(0,0,0,.55)}
.fr::before{content:"";position:absolute;left:50%;top:-14px;width:46px;height:5px;margin-left:-23px;border-radius:2px;background:linear-gradient(#f3d77e,#8f651a);box-shadow:0 2px 3px rgba(0,0,0,.5)}

.plq{min-width:72px;padding:3px 10px;text-align:center;font-size:14px;line-height:1.2;color:#2b1c07;background:linear-gradient(#f0d98d,#c19a3d);border:1px solid #6e4e10;box-shadow:inset 0 1px 0 #fff6,0 2px 3px rgba(0,0,0,.5)}
.gal-floor{position:relative;height:56px;flex:none;background:
  repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.28) 10px 11px),
  repeating-linear-gradient(-45deg,transparent 0 10px,rgba(0,0,0,.28) 10px 11px),
  repeating-linear-gradient(90deg,#b07b43 0 21px,#9c6a36 21px 42px)}
.gal-floor::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(#e6c776,#8b6417)}
.gal-floor::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,226,170,.28),transparent 75%)}

  { id:'letter', icon:'📄', label:'For my love', title:'For my love.txt', h:430,
    body:()=>`<div class="lt"><p class="lt-time">11:11PM, 11/11</p><p>When I look into your deep boundless eyes filled with love, and when I see you lips curve into that warm tender smile, time itself comes to a halt for me while my heart still beats and I can finally see my world - I see you</p><p class="lt-love">I love you Nanziba</p><p>And even the heavens weep when they see how beautiful and deep the love we hold for eachother is.</p><button class="heart-btn" id="lvHeart" aria-pressed="false" aria-label="Half-formed heart. Click to complete it"><svg viewBox="0 0 13 11" aria-hidden="true"></svg></button></div>`,

  { id:'paper', icon:ENV, label:'1', title:'1.txt', h:610, w:580, cls:'paper',
    body:()=>`<div class="sheet"><p>I LOVEEE YOUU NANZIBA, I could lose myself looking at your deep boundless eyes, so full of love and passion, for years and for all my lifetimes. When I look into them, I see everything you feel inside, and the beauty of your warm heart, and you shine brighter than a billion suns. Your pretty lips inspire a thousand poems within me. Everytime you smile at me makes my heart flutter and realize howww much you adore me, and every word they speak to me sounds like home. Your gigglu is my favorite song, and your voice is the first thing I want to hear on my worst days and my best ones. You are the softest light I’ve ever known and the bravest heart I’ve ever met. If I were given a thousand lifetimes, I would spend every one of them finding you again, falling for you again, and choosing you again. I’d choose you in every version of the universe, in every quiet morning and every starlit night, until the stars burn out and long after. You are my forever, my peace, and my favorite place to be. I love you endlessly. ❤️</p></div>` },
  { id:'paper2', icon:ENV, label:'2', title:'2.txt', h:610, w:580, cls:'paper',

 am SOOO ridiculously excited for everything that awaits us. NOW AND FOREVER BABY. ❤️❤️❤️❤️</p></div>` },

/* ---- The Louvre: add a photo = copy it into img/ and add a line here (o:'p' tall, o:'l' wide). The window grows and scrolls. ---- */
const GALLERY=[
 {src:'img/my-love.jpg',title:'My Love',o:'p',first:true},
 {src:'img/my-joy.jpg',title:'My Joy',o:'l'},
 {src:'img/my-inspiration.jpg',title:'My Inspiration',o:'p'},
 {src:'img/my-pretty-princess.jpg',title:'My Pretty Princess',o:'l'},
 {src:'img/my-goat.jpg',title:'My GOAT',o:'l'},
 {src:'img/my-sweetheart.jpg',title:'My Sweetheart',o:'p'},
 {src:'img/my-darling.jpg',title:'My Darling',o:'p'},
 {src:'img/my-peace.jpg',title:'My Peace',o:'l'},
 {src:'img/my-treasure.jpg',title:'My Treasure',o:'l'},
 {src:'img/my-dream.jpg',title:'My Dream',o:'l'},
 {src:'img/my-wifey.jpg',title:'My Wifey',o:'l',last:true}
];
function louvrePiece(g,i){
  return `<figure class="piece" style="--o:${i}"><div class="fr"><div class="mat"><div class="cv has"><img src="${g.src}" alt="${esc(g.title)}"></div></div></div><figcaption class="plq">${esc(g.title)}</figcaption></figure>`;
}
/* two staggered columns. Tall and wide photos keep their own order, but are interleaved (and sent left/right) so that
   no wide photo ever sits directly under another wide one; then the two columns are kept close to equal height. */
function galleryCols(){
  const P=[],L=[]; GALLERY.forEach((g,i)=>{ if(!g.first&&!g.last) (g.o==='p'?P:L).push(i); });
  const fi=GALLERY.findIndex(g=>g.first), li=GALLERY.findIndex(g=>g.last);
  const H={p:330,l:265}, memo=new Map();
  const best=(a,b,l0,l1,d)=>{               // a,b = next tall/wide index; l0,l1 = last orientation per column; d = height gap
    if(a===P.length&&b===L.length) return {c:Math.abs(d)};
    const key=a+'|'+b+'|'+l0+'|'+l1+'|'+d; if(memo.has(key)) return memo.get(key);
    let r={c:Infinity};
    for(const t of ['p','l']){
      const idx=t==='p'?a:b; if(idx>=(t==='p'?P.length:L.length)) continue;
      for(const col of [0,1]){
        const last=col?l1:l0, v=(t==='l'&&last==='l')?1e6:0;
        const dd=d+(col?-1:1)*H[t];
        const n=best(t==='p'?a+1:a,t==='l'?b+1:b,col?l0:t,col?t:l1,dd);
        if(v+n.c<r.c) r={c:v+n.c,t,col};
      }
    }
    memo.set(key,r); return r;
  };
  const cols=[[],[]]; let a=0,b=0,l0='',l1='',d=0;
  if(fi>=0){ cols[0].push(louvrePiece(GALLERY[fi],fi)); l0=GALLERY[fi].o; d=H[l0]; }   /* pinned: first photo, top-left */
  while(a<P.length||b<L.length){
    const s=best(a,b,l0,l1,d), idx=s.t==='p'?P[a++]:L[b++];
    cols[s.col].push(louvrePiece(GALLERY[idx],idx));
    d+=(s.col?-1:1)*H[s.t]; if(s.col) l1=s.t; else l0=s.t;
  }
  return `<div class="gal-row">${cols.map(c=>`<div class="gal-col">${c.join('')}</div>`).join('')}</div>`+(li>=0?`<div class="gal-last">${louvrePiece(GALLERY[li],li)}</div>`:'');   /* pinned: last photo, alone and centred */
}

/* ---- LETTER HEART: half-formed and grey until clicked ---- */
function initHeart(el){
  const G=['..###...###..','.#####.#####.','#############','#############','#############','.###########.','..#########..','...#######...','....#####....','.....###.....','......#......'];
  const HL=new Set(['3,0','2,1','1,2']);
  const btn=el.querySelector('#lvHeart'), svg=btn.querySelector('svg');
  let h='';
  G.forEach((row,y)=>{ for(let x=0;x<row.length;x++){
    if(row[x]!=='#') continue;
    const half=x<=6;
    h+=`<rect class="hp${half?'':' ghost'}${HL.has(x+','+y)?' hl':''}" x="${x}" y="${y}" width="1" height="1" style="transition-delay:${half?0:(x-6)*45+y*18}ms"/>`;
  }});
  svg.innerHTML=h;
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('full')) return;
    btn.classList.add('full');
    btn.setAttribute('aria-pressed','true');
    btn.setAttribute('aria-label','Heart completed');
    startRain();
  });
}

/* ---- gentle rain once the heart is complete (falls behind the taskbar grass) ---- */
let rainOn=false;
function startRain(){
  if(snowMode){ startSnow(); return; }
  if(rainOn || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  rainOn=true;
  const cv=document.createElement('canvas'), cx=cv.getContext('2d');
  cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9000;opacity:0;transition:opacity 3s ease';
  document.body.appendChild(cv);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{cv.style.opacity='1'}));
  let W,H,floor,drops=[],splashes=[];
  const mk=init=>({x:Math.random()*(W+80)-40,y:init?Math.random()*floor:-20-Math.random()*60,l:11+Math.random()*11,v:300+Math.random()*200,a:.4+Math.random()*.4,land:floor-Math.random()*20});
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    floor=document.getElementById('tray').getBoundingClientRect().top;
    drops=Array.from({length:Math.min(260,Math.round(W/6))},()=>mk(true));
    splashes=[];
  }
  size(); addEventListener('resize',size);
  let last=performance.now();
  (function frame(now){
    if(!rainOn){ cv.remove(); return; }   /* snow mode switches the rain off */
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000); last=now;
    cx.clearRect(0,0,W,H);
    cx.lineWidth=1.5; cx.lineCap='round';
    for(let i=0;i<drops.length;i++){
      const d=drops[i];
      d.y+=d.v*dt; d.x+=40*dt;
      if(d.y>=d.land){
        if(splashes.length<120) splashes.push({x:d.x,y:d.land,t:0,p:[{vx:-22-Math.random()*20,vy:60+Math.random()*50},{vx:22+Math.random()*20,vy:60+Math.random()*50},{vx:(Math.random()-.5)*16,vy:80+Math.random()*50}]});
        drops[i]=mk(false); continue;
      }
      cx.strokeStyle=`rgba(190,215,255,${d.a})`;
      cx.beginPath(); cx.moveTo(d.x,d.y); cx.lineTo(d.x-40/d.v*d.l,d.y-d.l); cx.stroke();
    }
    for(let i=splashes.length-1;i>=0;i--){
      const s=splashes[i]; s.t+=dt;
      if(s.t>.5){ splashes.splice(i,1); continue; }
      const k=s.t/.5, r=3+k*14, a=.9*(1-k);
      cx.fillStyle=`rgba(215,232,255,${a})`;
      cx.fillRect(s.x-r,s.y,3,1.5); cx.fillRect(s.x+r-2,s.y,3,1.5);
      cx.fillRect(s.x-r*.55,s.y+1,2,1); cx.fillRect(s.x+r*.55,s.y+1,2,1);
      for(const p of s.p){ const hgt=p.vy*s.t-180*s.t*s.t; if(hgt<0) continue; cx.fillRect(s.x+p.vx*s.t,s.y-hgt,2,2); }
    }
  })(performance.now());
}

/* ---- SNOW MODE: the snowflake lights up, the rain turns to snow, grass + tulips become snow, wallpaper changes ---- */
let snowMode=false, snowOn=false, snowGen=0;
function setSnowBtn(lit){
  const btn=document.getElementById('snBtn'); if(!btn) return;
  btn.classList.toggle('lit',lit); btn.setAttribute('aria-pressed',lit?'true':'false');
  btn.setAttribute('aria-label',lit?'Snowflake lit. It is snowing':'Snowflake. Click to make it snow');
}
function enterSnow(){
  if(snowMode) return;
  snowMode=true; rainOn=false;                    /* rain (if any) stops */
  document.body.classList.remove('back'); document.body.classList.add('snow');
  setSnowBtn(true); startSnow();
}
function leaveSnow(){                              /* the big 11/11 icon: back to the Minecraft desktop, new wallpaper */
  if(!snowMode) return;
  snowMode=false; snowOn=false; snowGen++;        /* snow stops */
  document.body.classList.remove('snow'); document.body.classList.add('back');   /* grass + tulips return */
  setSnowBtn(false);
}
document.getElementById('elev').addEventListener('click',leaveSnow);
function initSnowflake(el){
  const btn=el.querySelector('#snBtn'), svg=btn.querySelector('svg');
  const on=new Set(), add=(x,y)=>{ if(x>=0&&x<15&&y>=0&&y<15) on.add(x+','+y); };
  for(let r=0;r<=7;r++){ add(7+r,7);add(7-r,7);add(7,7+r);add(7,7-r); if(r<=5){ add(7+r,7+r);add(7-r,7-r);add(7+r,7-r);add(7-r,7+r); } }
  for(const s of [-1,1]) for(const t of [-1,1]){            /* little branches on the straight arms */
    add(7+s*4,7+t*1);add(7+s*5,7+t*2); add(7+t*1,7+s*4);add(7+t*2,7+s*5);
  }
  svg.innerHTML=[...on].map(k=>{const [x,y]=k.split(',');return `<rect x="${x}" y="${y}" width="1" height="1"/>`}).join('');
  setSnowBtn(snowMode);
  btn.addEventListener('click',enterSnow);
}
function startSnow(){
  if(snowOn || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  snowOn=true; const gen=++snowGen;
  const cv=document.createElement('canvas'), cx=cv.getContext('2d');
  cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9000;opacity:0;transition:opacity 3s ease';
  document.body.appendChild(cv);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{cv.style.opacity='1'}));
  let W,H,floor,flakes=[];
  const mk=init=>{ const big=Math.random()<.18; return {x:Math.random()*W,y:init?Math.random()*floor:-10-Math.random()*40,r:big?2.4+Math.random()*1.6:.9+Math.random()*1.5,v:(big?55:28)+Math.random()*40,ph:Math.random()*6.28,sw:10+Math.random()*22,sp:.6+Math.random()*1.1,a:.55+Math.random()*.45,land:floor-Math.random()*16}; };
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    floor=document.getElementById('tray').getBoundingClientRect().top;
    flakes=Array.from({length:Math.min(240,Math.round(W/4.5))},()=>mk(true));
  }
  size(); addEventListener('resize',size);
  let last=performance.now();
  (function frame(now){
    if(!snowOn || gen!==snowGen){ cv.remove(); removeEventListener('resize',size); return; }   /* leaving snow mode switches the snow off */
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000); last=now;
    cx.clearRect(0,0,W,H);
    for(let i=0;i<flakes.length;i++){
      const f=flakes[i];
      f.y+=f.v*dt; f.ph+=f.sp*dt;
      const x=f.x+Math.sin(f.ph)*f.sw;
      if(f.y>=f.land){ flakes[i]=mk(false); continue; }
      cx.fillStyle=`rgba(255,255,255,${f.a})`;
      cx.beginPath(); cx.arc(x,f.y,f.r,0,6.283); cx.fill();
    }
  })(performance.now());
}

const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const freq=n=>{const m=/^([A-G])([b#]?)(\d)$/.exec(n);return 440*2**((NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12-69)/12)};
const seq=s=>s.split(' ').map(t=>{const p=t.split(':');return [p[0],+p[1]]});
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Songs live in audio/ next to the page. To add one: copy the mp3 there and add a line here. */
const TUNES=[
 {title:'Subwoofer Lullaby',artist:'C418',type:'file',src:'audio/01-subwoofer-lullaby.mp3'},
 {title:'In the Pool',artist:'',type:'file',src:'audio/11-in-the-pool.mp3'},
 {title:'About You',artist:'The 1975',type:'file',src:'audio/02-about-you.mp3'},
 {title:'Lost Kitten',artist:'Metric',type:'file',src:'audio/03-lost-kitten.mp3'},
 {title:'Heavy',artist:'The Marías',type:'file',src:'audio/04-heavy.mp3'},
 {title:'southbound',artist:'Artemas',type:'file',src:'audio/05-southbound.mp3'},
 {title:'Hootie Frutti',artist:'KATSEYE',type:'file',src:'audio/06-hootie-frutti.mp3'},
 {title:'VESNA HARDTEKK',artist:'',type:'file',src:'audio/07-vesna-hardtekk.mp3'},
 {title:'Soft Spot',artist:'keshi',type:'file',src:'audio/08-soft-spot.mp3'},
 {title:'Hotel California',artist:'Joji',type:'file',src:'audio/09-hotel-california.mp3'},
 {title:'we fell in love in october',artist:'girl in red',type:'file',src:'audio/10-we-fell-in-love-in-october.mp3'}

const PL={
  tracks:[...TUNES],i:-1,playing:false,ctx:null,master:null,oscs:[],start:0,dur:0,vol:.8,timer:null,audio:new Audio(),
  init(el){
    this.audio.onended=()=>this.next();
    this.render();
    el.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.i!==undefined) this.play(+b.dataset.i);
      else if(b.dataset.c==='pp') this.pp();
      else if(b.dataset.c==='next') this.next();
      else if(b.dataset.c==='prev') this.prev();
      else if(b.dataset.c==='file') document.getElementById('plF').click();
    });
    el.querySelector('#plS').oninput=e=>this.seekTo(e.target.value/1000);
    el.querySelector('#plV').oninput=e=>this.setVol(e.target.value/100);
    el.querySelector('#plV').value=this.vol*100;
    el.querySelector('#plF').onchange=e=>{[...e.target.files].forEach(f=>this.tracks.push({title:f.name.replace(/\.[^.]+$/,''),artist:'From your device',type:'file',src:URL.createObjectURL(f)}));this.render();};
    if(!this.timer) this.timer=setInterval(()=>this.tick(),250);
  },
  halt(){
    this.audio.pause();
    this.oscs.forEach(o=>{try{o.stop()}catch(e){}}); this.oscs=[];
    if(this.master){this.master.disconnect();this.master=null}
    if(this.ctx) this.ctx.resume();
  },
  stop(){ this.halt(); this.playing=false; this.i=-1; this.render(); },
  ac(){
    if(!this.ctx){
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.an=this.ctx.createAnalyser(); this.an.fftSize=256; this.an.smoothingTimeConstant=.75;
      this.an.connect(this.ctx.destination);
    }
    return this.ctx;
  },
  wire(){
    const c=this.ac();
    if(!this.fg){ this.fg=c.createGain(); this.fg.gain.value=this.vol; this.fg.connect(this.an); c.createMediaElementSource(this.audio).connect(this.fg); }
    c.resume();
  },
  setVol(v){
    this.vol=v;
    if(this.master) this.master.gain.value=.2*v;
    if(this.fg) this.fg.gain.value=v; else this.audio.volume=v;
    ['plV','miV'].forEach(id=>{const e=document.getElementById(id); if(e) e.value=v*100;});
  },
  play(i){
    this.halt(); this.i=i; const t=this.tracks[i];
    if(t.type==='file'){ let same=true; try{ same=/^(blob|data):/.test(t.src)||new URL(t.src,location.href).origin===location.origin; }catch(e){} if(same) this.wire(); else this.audio.volume=this.vol; this.audio.src=t.blobUrl||t.src; this.audio.play().catch(()=>{}); }
    else this.sched(t);
    this.playing=true; this.render();
  },
  sched(t){
    const c=this.ac(); c.resume();
    const spb=60/t.bpm, now=c.currentTime+.1;
    this.master=c.createGain(); this.master.gain.value=.2*this.vol; this.master.connect(this.an);
    const mel=seq(t.mel).concat(seq(t.mel)), total=mel.reduce((s,n)=>s+n[1],0);
    const voice=(notes,wave,vol)=>{
      let tm=0;
      while(tm<total){ for(const [n,b] of notes){
        if(tm>=total) break;
        const o=c.createOscillator(), g=c.createGain();
        o.type=wave; o.frequency.value=freq(n);
        g.gain.setValueAtTime(vol,now+tm*spb); g.gain.exponentialRampToValueAtTime(.001,now+(tm+b*.95)*spb);
        o.connect(g); g.connect(this.master); o.start(now+tm*spb); o.stop(now+(tm+b)*spb);
        this.oscs.push(o); tm+=b;
      }}
    };
    voice(mel,t.wave,t.vol); voice(seq(t.bass),'triangle',.9);
    this.start=now; this.dur=total*spb;
  },
  pp(){
    const t=this.tracks[this.i]; if(!t){ this.play(0); return; }
    if(t.type==='file'){ if(this.audio.paused){this.audio.play();this.playing=true}else{this.audio.pause();this.playing=false} }
    else if(this.playing){ this.ctx.suspend(); this.playing=false; } else { this.ctx.resume(); this.playing=true; }
    this.render();
  },
  /* seeking: direct when the browser can; otherwise (host without range requests) swap in a fully downloaded copy */
  seekTo(frac){
    const a=this.audio,t=this.tracks[this.i];
    if(!t||t.type!=='file'||!a.duration) return;
    const target=frac*a.duration;
    for(let k=0;k<a.seekable.length;k++){ if(target>=a.seekable.start(k)&&target<=a.seekable.end(k)-.25){ a.currentTime=target; return; } }
    this.want=target;
    if(!t.blobP) t.blobP=fetch(t.src).then(r=>r.blob()).then(b=>(t.blobUrl=URL.createObjectURL(b)));
    t.blobP.then(url=>{
      if(this.tracks[this.i]!==t||this.want==null) return;
      const goal=this.want; this.want=null;
      if(a.src!==url){ const was=!a.paused; a.src=url; a.addEventListener('loadedmetadata',()=>{ a.currentTime=goal; if(was) a.play().catch(()=>{}); },{once:true}); }
      else a.currentTime=goal;
    }).catch(()=>{});
  },
  next(){ this.play((this.i+1)%this.tracks.length); },
  prev(){ this.play((this.i-1+this.tracks.length)%this.tracks.length); },
  tick(){
    const t=this.tracks[this.i]; if(!t||!this.playing) return;
    let cur,dur;
    if(t.type==='file'){ cur=this.audio.currentTime; dur=this.audio.duration; }
    else { cur=this.ctx.currentTime-this.start; dur=this.dur; if(cur>=dur){ this.next(); return; } }
    const g=id=>document.getElementById(id); if(g('miC')) g('miC').textContent=fmt(cur)+' / '+fmt(dur); if(!g('plC')) return;
    g('plC').textContent=fmt(cur); g('plD').textContent=fmt(dur);
    g('plS').value=dur?Math.max(0,cur)/dur*1000:0;
  },
  render(){
    const g=id=>document.getElementById(id);
    const t=this.tracks[this.i];
    if(g('miT')){
      g('miT').textContent=t?t.title:'Nothing playing';
      g('miPP').textContent=this.playing?'⏸':'▶'; g('miPP').setAttribute('aria-label',this.playing?'Pause':'Play');
      g('mini').classList.toggle('on',this.playing);
      if(!t) g('miC').textContent='0:00 / 0:00';
    }
    if(!g('plL')) return;
    g('plT').textContent=t?t.title:'Pick a song'; g('plA').textContent=t?t.artist:'';
    g('plPP').textContent=this.playing?'⏸':'▶'; g('plPP').setAttribute('aria-label',this.playing?'Pause':'Play');
    g('plS').disabled=!t||t.type!=='file';
    g('plL').innerHTML=this.tracks.map((x,k)=>`<button class="pl-item${k===this.i?' on':''}" data-i="${k}"><span class="pl-n">${k+1}.</span>${k===this.i&&this.playing?'▶':'♪'} ${esc(x.title)}<small>${esc(x.artist)}</small></button>`).join('');
  }
};

const $ = s => document.querySelector(s);
const desk = $('#desk'), tasks = $('#tasks'), menu = $('#menu'), startBtn = $('#start');
const isMobile = () => matchMedia('(max-width:640px)').matches;
const isCoarse = () => matchMedia('(pointer:coarse)').matches;
const wins = {}; let z = 10, opened = 0;

function setActive(id){
  Object.entries(wins).forEach(([k,w])=>{
    const on = k===id && !w.el.hidden;
    w.el.classList.toggle('active',on); w.task.classList.toggle('active',on);
  });
}
function focusWin(id){ const w=wins[id]; w.el.hidden=false; w.el.style.zIndex=++z; setActive(id); }
function minimize(id){ wins[id].el.hidden=true; setActive(null); }
function closeWin(id){ if(id==='player') PL.stop(); wins[id].el.remove(); wins[id].task.remove(); delete wins[id]; }

function openApp(id){
  closeMenu();
  if(wins[id]) return focusWin(id);
  const a = APPS.find(x=>x.id===id);
  const el = document.createElement('section');
  el.className='win'+(a.cls?' '+a.cls:''); el.setAttribute('role','dialog'); el.setAttribute('aria-label',a.title);
  el.innerHTML = `<header class="bar"><span class="ti">${a.icon} ${a.title}</span><span class="btns">
    <button data-a="min" aria-label="Minimize">_</button><button data-a="max" aria-label="Maximize">□</button><button data-a="close" aria-label="Close">×</button></span></header>
    <div class="body">${a.body()}</div>`;
  const n = opened++ % 6;
  el.style.left = Math.max(0, Math.min(90+n*30, desk.clientWidth-(a.w||380)-10)) + 'px';
  el.style.top = (24+n*30)+'px';
  if(a.h) el.style.height=a.h+'px';
  if(a.w) el.style.width='min('+a.w+'px,92vw)';
  desk.appendChild(el);
  if(a.init) a.init(el);
  const task = document.createElement('button');
  task.className='task'; task.innerHTML = a.icon+' '+a.label;
  task.onclick = () => (wins[id].el.hidden || !task.classList.contains('active')) ? focusWin(id) : minimize(id);
  tasks.appendChild(task);
  wins[id] = {el,task};
  const bar = el.querySelector('.bar');
  el.addEventListener('pointerdown',()=>focusWin(id));
  el.querySelector('.btns').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    ({min:()=>minimize(id),max:()=>el.classList.toggle('max'),close:()=>closeWin(id)})[b.dataset.a]();
  });
  bar.addEventListener('dblclick',e=>{ if(!e.target.closest('button') && !isMobile()) el.classList.toggle('max'); });
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||isMobile()||el.classList.contains('max')) return;
    const sx=e.clientX-el.offsetLeft, sy=e.clientY-el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const mv=ev=>{
      el.style.left = Math.max(80-el.offsetWidth, Math.min(desk.clientWidth-80, ev.clientX-sx))+'px';
      el.style.top = Math.max(0, Math.min(desk.clientHeight-30, ev.clientY-sy))+'px';
    };
    const up=()=>{ bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); bar.removeEventListener('pointercancel',up); };
    bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up); bar.addEventListener('pointercancel',up);
  });
  focusWin(id);
}

/* desktop icons + start menu */
APPS.forEach(a=>{
  const b=document.createElement('button');
  b.className='icon'; b.innerHTML=`<span class="g">${a.icon}</span><span class="l">${a.label}</span>`;
  b.onclick=()=>{ if(isCoarse()) openApp(a.id); else { document.querySelectorAll('.icon').forEach(i=>i.classList.remove('sel')); b.classList.add('sel'); } };
  b.ondblclick=()=>openApp(a.id);
  b.onkeydown=e=>{ if(e.key==='Enter'){ openApp(a.id); } };
  $('#icons').appendChild(b);
});
$('#menulist').innerHTML = APPS.map(a=>`<li><button data-id="${a.id}"><span>${a.icon}</span>${a.label}</button></li>`).join('')
  + `<li><hr></li><li><button data-id="_off"><span>🌙</span>Close all windows</button></li>`;
$('#menulist').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.id==='_off'){ Object.keys(wins).forEach(closeWin); closeMenu(); } else openApp(b.dataset.id);
});
function closeMenu(){ menu.hidden=true; startBtn.setAttribute('aria-expanded','false'); }
startBtn.onclick=e=>{ e.stopPropagation(); const open=menu.hidden; menu.hidden=!open; startBtn.setAttribute('aria-expanded',String(open)); };
document.addEventListener('pointerdown',e=>{
  if(!menu.contains(e.target) && e.target!==startBtn) closeMenu();
  if(!e.target.closest('.icon')) document.querySelectorAll('.icon').forEach(i=>i.classList.remove('sel'));
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenu(); });

/* mini player widget: controls + drag */
const mini=$('#mini'), mh=mini.querySelector('.mh');
mini.addEventListener('pointerdown',()=>{ mini.style.zIndex=++z; });
$('#miV').oninput=e=>PL.setVol(e.target.value/100);
$('#miCover').src=COVER;
mini.querySelector('.mctl').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  ({pp:()=>PL.pp(),next:()=>PL.next(),prev:()=>PL.prev()})[b.dataset.c]();
});
mh.addEventListener('pointerdown',e=>{
  const r=mini.getBoundingClientRect(), d=desk.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  mh.setPointerCapture(e.pointerId);
  const mv=ev=>{
    mini.style.right='auto';
    mini.style.left=Math.max(0,Math.min(desk.clientWidth-mini.offsetWidth,ev.clientX-d.left-sx))+'px';
    mini.style.top=Math.max(0,Math.min(desk.clientHeight-mini.offsetHeight,ev.clientY-d.top-sy))+'px';
  };
  const up=()=>{ mh.removeEventListener('pointermove',mv); mh.removeEventListener('pointerup',up); mh.removeEventListener('pointercancel',up); };
  mh.addEventListener('pointermove',mv); mh.addEventListener('pointerup',up); mh.addEventListener('pointercancel',up);
});

/* pixel visualizer: bars + a heart that pulses on the beat */
const viz=$('#miViz'), vx=viz.getContext('2d'), RM=matchMedia('(prefers-reduced-motion:reduce)');
const HS=['.##.##.','#######','#######','.#####.','..###..','...#...'], HM=['.#.#.','#####','.###.','..#..'];
const EDGE=[1,2,3,4,6,8,12,18,28,44], peaks=new Array(9).fill(0), fdata=new Uint8Array(128);
let lastDraw=0;
function drawViz(t){
  requestAnimationFrame(drawViz);
  if(t-lastDraw<50) return; lastDraw=t;
  const live=PL.playing && PL.an && !RM.matches;
  if(live) PL.an.getByteFrequencyData(fdata); else fdata.fill(0);
  vx.clearRect(0,0,48,16);
  for(let b=0;b<9;b++){
    let s=0; for(let k=EDGE[b];k<EDGE[b+1];k++) s+=fdata[k];
    const v=s/(EDGE[b+1]-EDGE[b])*1.1;
    const h=Math.max(1,Math.min(15,Math.round(v/255*15)));
    peaks[b]=Math.max(h,peaks[b]-1);
    for(let y=0;y<h;y++){ vx.fillStyle=y<h*.5?'#b88fd6':'#ff6f91'; vx.fillRect(b*4,15-y,3,1); }
    vx.fillStyle='#ffffff'; vx.fillRect(b*4,15-peaks[b],3,1);
  }
  const beat=live && (fdata[0]+fdata[1])/2>190, spr=beat?HS:HM, ox=beat?39:40, oy=beat?4:5;
  vx.fillStyle='#ff6f91';
  spr.forEach((row,y)=>{ for(let x=0;x<row.length;x++) if(row[x]==='#') vx.fillRect(ox+x,oy+y,1,1); });
}
requestAnimationFrame(drawViz);

/* tulips across the taskbar: pink most, then red, then yellow */
const TULIPS={p:['#ff9cc2','#e0508a'],r:['#f0414f','#b3182c'],y:['#ffe066','#e8b200']};
const PATTERN='prpyprppyrp';
function tulip(c){
  const [a,b]=TULIPS[c];
  return `<svg viewBox="0 0 24 48" aria-hidden="true"><path d="M12 48V21" stroke="#4a7d36" stroke-width="2.2" fill="none"/><path d="M12 47C6 44 3 34 6 22c4 8 6 16 6 25z" fill="#4f8a3c"/><path d="M12 47C18 44 21 34 18 22c-4 8-6 16-6 25z" fill="#5e9b46"/><path d="M5 9C5 17 8 22 12 23c4-1 7-6 7-14-2 2-4 1-7-4-3 5-5 6-7 4z" fill="${b}"/><path d="M12 5C9 9 8 16 12 22c4-6 3-13 0-17z" fill="${a}"/></svg>`;
}
function plant(){
  let s=7; const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  const n=Math.ceil(innerWidth/34)+1; let html='';
  for(let i=0;i<n;i++){
    const h=44+Math.round(rnd()*20), x=Math.round(i*34+rnd()*12-12), r=Math.round(rnd()*12-6);
    html+=`<span class="tl" style="left:${x}px;height:${h}px;width:${Math.round(h/2)}px;--r:${r}deg;animation-delay:${-(rnd()*4).toFixed(2)}s">${tulip(PATTERN[i%PATTERN.length])}</span>`;
  }
  $('#tl').innerHTML=html;
}
plant(); let rzT; addEventListener('resize',()=>{clearTimeout(rzT); rzT=setTimeout(plant,150);});

pic.addEventListener('pointerdown',e=>{

  const mv=ev=>{
    pic.style.right='auto'; pic.style.bottom='auto';
    pic.style.left=Math.max(0,Math.min(desk.clientWidth-pic.offsetWidth,ev.clientX-d.left-sx))+'px';
    pic.style.top=Math.max(0,Math.min(desk.clientHeight-pic.offsetHeight,ev.clientY-d.top-sy))+'px';
  };
  const up=()=>{ pic.removeEventListener('pointermove',mv); pic.removeEventListener('pointerup',up); pic.removeEventListener('pointercancel',up); };
  pic.addEventListener('pointermove',mv); pic.addEventListener('pointerup',up); pic.addEventListener('pointercancel',up);
});
